  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="uno_no_mercy">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>uno_no_mercy</title>
  <link rel="manifest" href="manifest.json">
  <script>
    window.initVoiceMicrophone = async function() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          console.warn("getUserMedia not supported");
          return false;
        }
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        window.localVoiceStream = stream;
        return true;
      } catch (err) {
        console.warn("Microphone error:", err);
        return false;
      }
    };
    window.toggleVoiceMute = function(isMuted) {
      if (window.localVoiceStream) {
        window.localVoiceStream.getAudioTracks().forEach(function(track) {
          track.enabled = !isMuted;
        });
      }
    };
  </script>
</head>
<body>
